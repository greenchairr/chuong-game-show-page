defaultContentLanguage: vi

baseURL: https://github.com/greenchairr/chuong-game-show-page/

# Hugo configuration file
title: Chuông Gameshow không dây

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: "Trang chủ"
      url: "/"
      weight: 1
    - name: "Hướng dẫn"
      url: "/docs/"
      weight: 2
    - name: "Bảo hành"
      url: "/warranty/"
      weight: 3
    - name: "Liên hệ"
      url: "/contact/"
      weight: 4

params: 
    
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: "./web-app-manifest-512x512.png"   
      width: 40
      height: 40
      link: /chuong-game-show-page/

  heading:
    anchors: false
    
  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false

  

  
