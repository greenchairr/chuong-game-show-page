# Hugo configuration file
title: Điện Tử Cà Mau               # ← Change this to your product/brand name
logo: "/images/your-logo.png"       # ← Or link to your logo image
logoWidth: 40                       # ← Adjust size if needed

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "Manual"
      url: "/docs/"
      weight: 2
    - name: "Contact"
      url: "/contact/"
      weight: 3
      

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
