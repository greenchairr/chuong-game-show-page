  
baseURL: https://github.com/greenchairr/chuong-game-show-page/

# Hugo configuration file
title: Điện Tử Cà Mau
favicon: /images/your-logo.png

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: "Trang Chủ"
      url: "/"
      weight: 1
    - name: "Hướng Dẫn Sử Dụng"
      url: "/docs/"
      weight: 2
    - name: "Liên Hệ"
      url: "/contact/"
      weight: 3

params:    
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: "./images/your-logo.png"   
      width: 40
      height: 40
      link: /chuong-game-show-page/

  heading:
    anchors: false
    
  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false

  

  
